
# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
 CONFIG_ZMK_DISPLAY=y

# --- Power: deep sleep after 15 min idle (first keypress only wakes it) ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Show both halves' battery levels on the computer ---
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Stronger Bluetooth signal (fewer dropouts, slightly more battery use) ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# --- RGB lighting: uncomment if you have it, so it turns off when idle ---
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# --- Mouse scroll keys: uncomment only if you add scroll keys to the keymap ---
# (on older ZMK, before about early 2025, use CONFIG_ZMK_MOUSE=y instead)
# CONFIG_ZMK_POINTING=y
